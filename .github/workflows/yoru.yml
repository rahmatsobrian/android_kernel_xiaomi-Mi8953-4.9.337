name: Yoru Kernel

on:
  workflow_dispatch:
  watch:
    types: [started]

defaults:
  run:
    shell: bash

jobs:
  buildtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 4

      - name: Install Packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            dialog bash sed wget git curl zip tar jq expect make cmake automake autoconf \
            llvm lld lldb clang gcc binutils bison perl gperf gawk flex bc python3 python3-pip zstd \
            openssl unzip cpio build-essential ccache liblz4-tool libsdl1.2-dev libstdc++6 \
            libxml2 libxml2-utils lzop pngcrush schedtool squashfs-tools xsltproc zlib1g-dev \
            libncurses5-dev bzip2 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            gcc-arm-linux-gnueabi dos2unix kmod
          
          # Install Telethon untuk Userbot
          python3 -m pip install telethon

      - name: Setup ZyC Clang
        run: |
          mkdir -p clang-zyc
          cd clang-zyc
            wget -q $(curl -k https://raw.githubusercontent.com/ZyCromerZ/Clang/main/Clang-12-link.txt) -O zyc-clang.tar.gz
            tar -xf zyc-clang.tar.gz
            rm -f zyc-clang.tar.gz

      - name: Setup KernelSU (Hookless)
        run: |
          # curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          # curl -LSs "https://raw.githubusercontent.com/Mr-Morat/KernelSU-Next/stable/kernel/setup.sh" | bash -s syscall
          curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/master/kernel/setup.sh" | bash -s v3.3.1

      # - name: Patch Kernel With Manual Hook
        # run: |
          # patch -p1 < 0001-ksu-manual-hooks-k49-final.patch

      - name: Start Build (KSU + NonKSU)
        env:
          KBUILD_BUILD_USER: "Hoshino"
          KBUILD_BUILD_HOST: "Yoru"
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
          TELE_API_ID: ${{ secrets.TELE_API_ID }}
          TELE_API_HASH: ${{ secrets.TELE_API_HASH }}
          TELE_SESSION: ${{ secrets.TELE_SESSION }}
        run: |
          mkdir -p logs
          bash yoru.sh 2>&1 | tee logs/build-all.txt

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/
          if-no-files-found: ignore

      - name: Upload AnyKernel Zips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anykernel-zips
          path: zips/*.zip
          if-no-files-found: ignore

      - name: Upload Kernel Images (Image.gz & Image.gz-dtb)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-images
          path: images/
          if-no-files-found: ignore
